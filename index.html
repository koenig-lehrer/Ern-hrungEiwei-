'use strict';
const DATA=[{"title": {"de": "Protein heißt auch Eiweiß", "uk": "Протеїн — це білок"}, "text": {"de": "Protein und Eiweiß sind zwei Namen für denselben Nährstoff. Gemeint ist nicht nur das Weiße im Ei. Eiweiß steckt in vielen Lebensmitteln. Dein Körper braucht es als Baustoff.", "uk": "Протеїн і білок — дві назви однієї поживної речовини. Це не лише біла частина яйця. Білок міститься в багатьох продуктах. Тіло потребує його як будівельного матеріалу."}, "memo": {"de": "Protein ist ein anderes Wort für Eiweiß.", "uk": "Протеїн — інша назва білка."}, "questions": [{"q": {"de": "Was bedeutet das Wort Protein?", "uk": "Що означає слово «протеїн»?"}, "options": [{"de": "Eiweiß.", "uk": "Білок."}, {"de": "Zucker.", "uk": "Цукор."}, {"de": "Fett.", "uk": "Жир."}, {"de": "Wasser.", "uk": "Вода."}], "explain": {"de": "Beide Wörter bezeichnen denselben Nährstoff.", "uk": "Обидва слова означають ту саму поживну речовину."}}, {"q": {"de": "Auf einer Verpackung steht „Protein“. Was ist damit gemeint?", "uk": "На упаковці написано «протеїн». Що це означає?"}, "options": [{"de": "Der Nährstoff Eiweiß.", "uk": "Поживна речовина білок."}, {"de": "Nur das Weiße eines Eis.", "uk": "Лише біла частина яйця."}, {"de": "Ein besonderer Zucker.", "uk": "Особливий цукор."}, {"de": "Ein Vitamin.", "uk": "Вітамін."}], "explain": {"de": "Protein ist der Fachbegriff für Eiweiß.", "uk": "Протеїн — наукова назва білка."}}, {"q": {"de": "Welche Aussage stimmt?", "uk": "Яке твердження правильне?"}, "options": [{"de": "Protein und Eiweiß meinen dasselbe.", "uk": "Протеїн і білок означають те саме."}, {"de": "Eiweiß gibt es nur in Eiern.", "uk": "Білок є лише в яйцях."}, {"de": "Protein ist nur in Sportpulver.", "uk": "Протеїн є лише у спортивних порошках."}, {"de": "Eiweiß ist ein Mineralstoff.", "uk": "Білок — мінеральна речовина."}], "explain": {"de": "Eiweiß ist ein Nährstoff in vielen normalen Lebensmitteln.", "uk": "Білок — поживна речовина в багатьох звичайних продуктах."}}]}, {"title": {"de": "Pflanzlich und tierisch", "uk": "Рослинні й тваринні джерела"}, "text": {"de": "Linsen, Erbsen, Soja und Getreideprodukte liefern pflanzliches Eiweiß. Auch Nüsse tragen zur Versorgung bei. Tierische Quellen sind Milchprodukte, Eier, Fisch und Fleisch. Du brauchst also nicht für jedes eiweißhaltige Essen Fleisch.", "uk": "Сочевиця, горох, соя та зернові продукти дають рослинний білок. Горіхи теж допомагають забезпечити ним тіло. Тваринні джерела — молочні продукти, яйця, риба та м’ясо. Отже, білкова їжа не обов’язково має містити м’ясо."}, "memo": {"de": "Eiweiß steckt in pflanzlichen und tierischen Lebensmitteln.", "uk": "Білок міститься в рослинних і тваринних продуктах."}, "questions": [{"q": {"de": "Welche Gruppe enthält pflanzliche Eiweißquellen?", "uk": "Яка група містить рослинні джерела білка?"}, "options": [{"de": "Linsen, Erbsen und Soja.", "uk": "Сочевиця, горох і соя."}, {"de": "Milch, Käse und Eier.", "uk": "Молоко, сир і яйця."}, {"de": "Fisch, Fleisch und Quark.", "uk": "Риба, м’ясо й кисломолочний сир."}, {"de": "Eier, Fisch und Joghurt.", "uk": "Яйця, риба й йогурт."}], "explain": {"de": "Hülsenfrüchte sind pflanzliche Proteinquellen.", "uk": "Бобові — рослинні джерела білка."}}, {"q": {"de": "Welche Eiweißquelle stammt von einem Tier?", "uk": "Яке джерело білка має тваринне походження?"}, "options": [{"de": "Quark.", "uk": "Кисломолочний сир."}, {"de": "Linsen.", "uk": "Сочевиця."}, {"de": "Erbsen.", "uk": "Горох."}, {"de": "Soja.", "uk": "Соя."}], "explain": {"de": "Quark wird aus Milch hergestellt.", "uk": "Кисломолочний сир виготовляють із молока."}}, {"q": {"de": "Kann auch Essen ohne Fleisch Eiweiß liefern?", "uk": "Чи може їжа без м’яса давати білок?"}, "options": [{"de": "Ja, zum Beispiel ein Linsengericht.", "uk": "Так, наприклад страва із сочевиці."}, {"de": "Nein, Eiweiß gibt es nur in Fleisch.", "uk": "Ні, білок є лише в м’ясі."}, {"de": "Nur mit einem Proteinpulver.", "uk": "Лише з протеїновим порошком."}, {"de": "Nein, Pflanzen liefern nur Wasser.", "uk": "Ні, рослини дають лише воду."}], "explain": {"de": "Pflanzliche Lebensmittel können Eiweiß liefern.", "uk": "Рослинні продукти можуть давати білок."}}]}, {"title": {"de": "Baustoff für deinen Körper", "uk": "Будівельний матеріал для тіла"}, "text": {"de": "Eiweiß wird für Zellen und Gewebe gebraucht. Dazu gehören auch Muskeln. Außerdem braucht der Körper Protein für Antikörper, Enzyme und Hormone. Eiweiß ist also nicht nur ein Thema für Sportlerinnen und Sportler.", "uk": "Білок потрібний для клітин і тканин, зокрема м’язів. Також він потрібний для антитіл, ферментів і гормонів. Отже, білок важливий не лише для спортсменів."}, "memo": {"de": "Mein Körper braucht Eiweiß für Zellen, Muskeln und Antikörper.", "uk": "Моєму тілу потрібний білок для клітин, м’язів і антитіл."}, "questions": [{"q": {"de": "Wofür braucht dein Körper Eiweiß?", "uk": "Для чого тілу потрібний білок?"}, "options": [{"de": "Für Zellen, Muskeln und Antikörper.", "uk": "Для клітин, м’язів і антитіл."}, {"de": "Nur für große Muskeln.", "uk": "Лише для великих м’язів."}, {"de": "Nur für die Farbe der Augen.", "uk": "Лише для кольору очей."}, {"de": "Nur als Ersatz für Wasser.", "uk": "Лише як заміна води."}], "explain": {"de": "Protein hat verschiedene Aufgaben im Körper.", "uk": "Білок виконує різні завдання в тілі."}}, {"q": {"de": "Welche Aussage über Eiweiß stimmt?", "uk": "Яке твердження про білок правильне?"}, "options": [{"de": "Es ist auch ein Baustoff für Körperzellen.", "uk": "Він також є матеріалом для клітин тіла."}, {"de": "Nur Menschen im Fitnessstudio brauchen es.", "uk": "Він потрібний лише тим, хто ходить у спортзал."}, {"de": "Es macht Schlaf überflüssig.", "uk": "Він робить сон непотрібним."}, {"de": "Es ersetzt alle anderen Nährstoffe.", "uk": "Він замінює всі інші поживні речовини."}], "explain": {"de": "Der Körper braucht Eiweiß auch ohne Fitnessstudio.", "uk": "Тілу потрібний білок і без спортзалу."}}, {"q": {"de": "Welche Stoffe bildet der Körper unter anderem mithilfe von Eiweißbausteinen?", "uk": "Які речовини тіло утворює, зокрема, з білкових складників?"}, "options": [{"de": "Antikörper.", "uk": "Антитіла."}, {"de": "Trinkwasser.", "uk": "Питну воду."}, {"de": "Speisesalz.", "uk": "Кухонну сіль."}, {"de": "Ballaststoffe im Brot.", "uk": "Клітковину в хлібі."}], "explain": {"de": "Die DGE nennt Antikörper als eine Aufgabe von Protein.", "uk": "DGE називає утворення антитіл однією з функцій білка."}}]}, {"title": {"de": "Kleine Bausteine: Aminosäuren", "uk": "Малі складники: амінокислоти"}, "text": {"de": "Proteine bestehen aus Aminosäuren. Stell sie dir als verschiedene kleine Bausteine vor. Einige kann dein Körper selbst herstellen. Andere muss er mit dem Essen bekommen. Diese heißen unentbehrliche Aminosäuren.", "uk": "Білки складаються з амінокислот. Уяви їх як різні маленькі будівельні блоки. Деякі тіло може виробляти саме. Інші воно має отримувати з їжею. Їх називають незамінними амінокислотами."}, "memo": {"de": "Einige Eiweißbausteine muss ich mit der Nahrung aufnehmen.", "uk": "Деякі складники білка я маю отримувати з їжею."}, "questions": [{"q": {"de": "Wie heißen die Bausteine von Proteinen?", "uk": "Як називаються складники білків?"}, "options": [{"de": "Aminosäuren.", "uk": "Амінокислоти."}, {"de": "Zuckerwürfel.", "uk": "Кубики цукру."}, {"de": "Wassertropfen.", "uk": "Краплі води."}, {"de": "Salzkörner.", "uk": "Кристали солі."}], "explain": {"de": "Aminosäuren sind die Bausteine von Proteinen.", "uk": "Амінокислоти — складники білків."}}, {"q": {"de": "Warum müssen wir bestimmte Aminosäuren essen?", "uk": "Чому певні амінокислоти треба отримувати з їжею?"}, "options": [{"de": "Der Körper kann sie nicht selbst herstellen.", "uk": "Тіло не може виробляти їх саме."}, {"de": "Sie sind nur ein Geschmackstoff.", "uk": "Вони лише надають смаку."}, {"de": "Sie ersetzen das Trinken.", "uk": "Вони замінюють пиття."}, {"de": "Der Körper braucht keine anderen Stoffe.", "uk": "Тілу не потрібні інші речовини."}], "explain": {"de": "Unentbehrliche Aminosäuren müssen aus der Nahrung kommen.", "uk": "Незамінні амінокислоти мають надходити з їжею."}}, {"q": {"de": "Was ist richtig über die Eiweißbausteine?", "uk": "Що правильно про складники білка?"}, "options": [{"de": "Einige stellt der Körper her, andere braucht er aus dem Essen.", "uk": "Деякі тіло виробляє, інші отримує з їжі."}, {"de": "Der Körper stellt alle selbst her.", "uk": "Тіло виробляє їх усі саме."}, {"de": "Sie kommen nur in Proteinriegeln vor.", "uk": "Вони є лише у протеїнових батончиках."}, {"de": "Sie bestehen nur aus Zucker.", "uk": "Вони складаються лише з цукру."}], "explain": {"de": "Die DGE unterscheidet entbehrliche und unentbehrliche Aminosäuren.", "uk": "DGE розрізняє замінні та незамінні амінокислоти."}}]}, {"title": {"de": "Clever kombinieren", "uk": "Поєднуй вдало"}, "text": {"de": "Verschiedene Lebensmittel bringen unterschiedliche Eiweißbausteine mit. Getreide und Hülsenfrüchte ergänzen sich gut. Beispiele sind Brot mit Linsenaufstrich oder Reis mit Erbsen. Mehr Pflanzenprotein statt Fleisch ist laut BZfE auch eine gute Wahl für das Klima.", "uk": "Різні продукти дають різні складники білка. Зернові та бобові добре доповнюють одне одного. Приклади: хліб із сочевичним паштетом або рис із горохом. За BZfE, більше рослинного білка замість м’яса — добрий вибір і для клімату."}, "memo": {"de": "Getreide und Hülsenfrüchte ergänzen sich beim Eiweiß.", "uk": "Зернові та бобові доповнюють одне одного за складом білка."}, "questions": [{"q": {"de": "Welche Kombination ergänzt sich beim Eiweiß gut?", "uk": "Яке поєднання добре доповнює склад білка?"}, "options": [{"de": "Reis mit Erbsen.", "uk": "Рис із горохом."}, {"de": "Wasser mit Eiswürfeln.", "uk": "Вода з льодом."}, {"de": "Zucker mit Limonade.", "uk": "Цукор із лимонадом."}, {"de": "Salz mit Wasser.", "uk": "Сіль із водою."}], "explain": {"de": "Getreide und Hülsenfrüchte ergänzen ihre Aminosäuren.", "uk": "Зернові та бобові доповнюють склад амінокислот."}}, {"q": {"de": "Du isst Brot. Was ergänzt es als pflanzliche Eiweißquelle gut?", "uk": "Ти їси хліб. Що добре доповнює його як рослинне джерело білка?"}, "options": [{"de": "Ein Aufstrich aus Linsen.", "uk": "Паштет із сочевиці."}, {"de": "Ein Glas Zuckerwasser.", "uk": "Склянка води з цукром."}, {"de": "Etwas Salz.", "uk": "Трохи солі."}, {"de": "Ein Eiswürfel.", "uk": "Кубик льоду."}], "explain": {"de": "Linsen sind Hülsenfrüchte, Brot ist ein Getreideprodukt.", "uk": "Сочевиця — бобова культура, хліб — зерновий продукт."}}, {"q": {"de": "Warum kann es helfen, verschiedene Eiweißquellen zu kombinieren?", "uk": "Чому корисно поєднувати різні джерела білка?"}, "options": [{"de": "Sie bringen unterschiedliche Aminosäuren mit.", "uk": "Вони дають різні амінокислоти."}, {"de": "Dann braucht man gar kein Eiweiß mehr.", "uk": "Тоді білок узагалі не потрібний."}, {"de": "So wird jedes Essen zu einem Proteinpulver.", "uk": "Так будь-яка їжа стає протеїновим порошком."}, {"de": "Nur eine einzige Sorte kann alle Menschen versorgen.", "uk": "Лише один вид може забезпечити всіх людей."}], "explain": {"de": "Beim Eiweiß zählt auch die Zusammensetzung seiner Bausteine.", "uk": "Важливий також склад білкових компонентів."}}]}, {"title": {"de": "Wie viel ist genug?", "uk": "Скільки достатньо?"}, "text": {"de": "Der Bedarf hängt unter anderem von Alter und Körpergewicht ab. Für 13- bis unter 15-Jährige nennt die DGE täglich 0,9 Gramm Eiweiß je Kilogramm Körpergewicht. Eine abwechslungsreiche Ernährung kann das normalerweise liefern. Du musst dafür keine Spezialprodukte kaufen.", "uk": "Потреба залежить, зокрема, від віку та маси тіла. Для дітей від 13 до 15 років DGE вказує 0,9 грама білка на кілограм маси тіла на день. Різноманітне харчування зазвичай може це забезпечити. Спеціальні продукти для цього купувати не потрібно."}, "memo": {"de": "Mit abwechslungsreichem Essen bekomme ich normalerweise genug Eiweiß.", "uk": "З різноманітною їжею я зазвичай отримую достатньо білка."}, "questions": [{"q": {"de": "Wie bekommen Jugendliche normalerweise genug Eiweiß?", "uk": "Як підлітки зазвичай отримують достатньо білка?"}, "options": [{"de": "Durch abwechslungsreiches Essen.", "uk": "Завдяки різноманітній їжі."}, {"de": "Nur durch teure Proteinriegel.", "uk": "Лише завдяки дорогим протеїновим батончикам."}, {"de": "Nur durch Proteinpulver.", "uk": "Лише завдяки протеїновому порошку."}, {"de": "Durch möglichst einseitiges Essen.", "uk": "Завдяки якомога одноманітнішій їжі."}], "explain": {"de": "Normale Lebensmittel können die Versorgung sichern.", "uk": "Звичайні продукти можуть забезпечити потребу."}}, {"q": {"de": "Ist die passende Eiweißmenge für alle Menschen gleich?", "uk": "Чи однакова потрібна кількість білка для всіх людей?"}, "options": [{"de": "Nein, Alter und Körpergewicht spielen eine Rolle.", "uk": "Ні, вік і маса тіла мають значення."}, {"de": "Ja, alle brauchen exakt dieselbe Menge.", "uk": "Так, усім потрібна однакова кількість."}, {"de": "Ja, die Verpackungsgröße bestimmt den Bedarf.", "uk": "Так, потребу визначає розмір упаковки."}, {"de": "Nein, nur der Preis des Essens zählt.", "uk": "Ні, важлива лише ціна їжі."}], "explain": {"de": "Die DGE unterscheidet verschiedene Altersgruppen.", "uk": "DGE розрізняє різні вікові групи."}}, {"q": {"de": "Braucht man für eine normale Eiweißversorgung unbedingt Spezialprodukte?", "uk": "Чи обов’язкові спеціальні продукти для звичайного забезпечення білком?"}, "options": [{"de": "Nein, abwechslungsreiche normale Lebensmittel reichen meist.", "uk": "Ні, різноманітних звичайних продуктів зазвичай достатньо."}, {"de": "Ja, ohne sie enthält Essen kein Eiweiß.", "uk": "Так, без них їжа не містить білка."}, {"de": "Ja, besonders teure Produkte sind Pflicht.", "uk": "Так, особливо дорогі продукти обов’язкові."}, {"de": "Ja, ein Proteinriegel ersetzt jede Mahlzeit.", "uk": "Так, протеїновий батончик замінює будь-яку їжу."}], "explain": {"de": "High-Protein-Produkte sind für die normale Versorgung nicht nötig.", "uk": "Для звичайного забезпечення продукти High Protein не потрібні."}}]}, {"title": {"de": "Regelmäßig versorgen", "uk": "Регулярне забезпечення"}, "text": {"de": "Deine Körperzellen werden ständig erneuert. Deshalb braucht dein Körper regelmäßig Eiweiß aus dem Essen. Fehlt es auf Dauer, fehlen Bausteine für diese Erneuerung. Das ist ein vereinfachtes Modell, keine Diagnose. Ein einzelnes Essen entscheidet nicht über deine Versorgung.", "uk": "Клітини тіла постійно оновлюються. Тому тіло потребує регулярного надходження білка з їжею. Якщо його тривалий час бракує, бракує складників для оновлення. Це спрощена модель, а не діагноз. Один прийом їжі не визначає забезпечення організму."}, "memo": {"de": "Mein Körper braucht regelmäßig Eiweiß, um Zellen zu erneuern.", "uk": "Моєму тілу регулярно потрібний білок для оновлення клітин."}, "questions": [{"q": {"de": "Warum braucht dein Körper regelmäßig Eiweiß?", "uk": "Чому тілу регулярно потрібний білок?"}, "options": [{"de": "Weil Körperzellen ständig erneuert werden.", "uk": "Бо клітини тіла постійно оновлюються."}, {"de": "Weil ein Riegel alle Nahrung ersetzt.", "uk": "Бо один батончик замінює всю їжу."}, {"de": "Weil Eiweiß nur einmal im Leben nötig ist.", "uk": "Бо білок потрібний лише раз у житті."}, {"de": "Weil nur Werbung den Bedarf bestimmt.", "uk": "Бо потребу визначає лише реклама."}], "explain": {"de": "Für die Erneuerung braucht der Körper regelmäßig Bausteine.", "uk": "Для оновлення тілу регулярно потрібні будівельні складники."}}, {"q": {"de": "Was zeigt das Modell, wenn auf Dauer zu wenig Eiweiß ankommt?", "uk": "Що показує модель, коли тривалий час надходить замало білка?"}, "options": [{"de": "Für die Erneuerung fehlen Bausteine.", "uk": "Для оновлення бракує складників."}, {"de": "Der Körper braucht keine Zellen mehr.", "uk": "Тілу більше не потрібні клітини."}, {"de": "Muskeln wachsen dadurch schneller.", "uk": "М’язи через це ростуть швидше."}, {"de": "Einzelne Lebensmittel machen sofort krank.", "uk": "Окремі продукти одразу спричиняють хворобу."}], "explain": {"de": "Das Modell veranschaulicht, warum regelmäßige Zufuhr nötig ist.", "uk": "Модель пояснює, чому регулярне надходження потрібне."}}, {"q": {"de": "Eine Mahlzeit enthält wenig Eiweiß. Was ist sinnvoll?", "uk": "В одній страві мало білка. Що доречно?"}, "options": [{"de": "Auf abwechslungsreiches Essen über längere Zeit achten.", "uk": "Звертати увагу на різноманітне харчування з часом."}, {"de": "Sofort eine Krankheit vermuten.", "uk": "Одразу підозрювати хворобу."}, {"de": "Ab jetzt nur Proteinpulver essen.", "uk": "Відтепер їсти лише протеїновий порошок."}, {"de": "Andere Lebensmittel ganz weglassen.", "uk": "Повністю відмовитися від інших продуктів."}], "explain": {"de": "Regelmäßige Versorgung ist wichtig, nicht eine einzelne Mahlzeit.", "uk": "Важливе регулярне забезпечення, а не одна окрема страва."}}]}, {"title": {"de": "High Protein: Werbung prüfen", "uk": "High Protein: перевіряй рекламу"}, "text": {"de": "Ein High-Protein-Produkt macht dich nicht automatisch fit oder muskulös. Für Freizeit- und Fitnesssport ist normalerweise keine Extraportion Eiweiß nötig. Vergleiche Zutaten, Nährwerte und Preis statt nur die Werbung. Eiweiß allein baut keine starken Muskeln.", "uk": "Продукт High Protein не робить тебе автоматично спортивним чи м’язистим. Для оздоровчого спорту й фітнесу додаткова порція білка зазвичай не потрібна. Порівнюй склад, поживну цінність і ціну, а не лише рекламу. Сам білок не створює сильних м’язів."}, "memo": {"de": "High-Protein-Produkte sind meist unnötig und machen mich nicht automatisch fit.", "uk": "Продукти High Protein зазвичай не потрібні й не роблять мене автоматично спортивним."}, "questions": [{"q": {"de": "Was stimmt über High-Protein-Produkte?", "uk": "Що правильно про продукти High Protein?"}, "options": [{"de": "Sie machen nicht automatisch fit oder muskulös.", "uk": "Вони не роблять автоматично спортивним чи м’язистим."}, {"de": "Sie ersetzen jedes Training.", "uk": "Вони замінюють будь-яке тренування."}, {"de": "Sie sind immer gesünder als normales Essen.", "uk": "Вони завжди корисніші за звичайну їжу."}, {"de": "Alle Jugendlichen müssen sie kaufen.", "uk": "Усі підлітки мають їх купувати."}], "explain": {"de": "Das BZfE rät, Werbeversprechen kritisch zu prüfen.", "uk": "BZfE радить критично перевіряти рекламні обіцянки."}}, {"q": {"de": "Was hilft beim Vergleichen eines Proteinprodukts mit einem normalen Produkt?", "uk": "Що допомагає порівняти протеїновий продукт зі звичайним?"}, "options": [{"de": "Zutaten, Nährwerte und Preis ansehen.", "uk": "Подивитися склад, поживну цінність і ціну."}, {"de": "Nur die großen Werbewörter lesen.", "uk": "Читати лише великі рекламні слова."}, {"de": "Immer die teuerste Packung kaufen.", "uk": "Завжди купувати найдорожчу упаковку."}, {"de": "Nur auf ein Muskelbild achten.", "uk": "Дивитися лише на зображення м’язів."}], "explain": {"de": "Die Verpackungswerbung allein sagt nicht, ob das Produkt sinnvoll ist.", "uk": "Сама реклама на упаковці не показує, чи доцільний продукт."}}, {"q": {"de": "Du machst Freizeitsport. Was passt laut BZfE normalerweise?", "uk": "Ти займаєшся оздоровчим спортом. Що за BZfE зазвичай підходить?"}, "options": [{"de": "Abwechslungsreich essen; Extra-Eiweiß ist meist unnötig.", "uk": "Їсти різноманітно; додатковий білок зазвичай не потрібний."}, {"de": "Jeden Tag zwingend Proteinshakes trinken.", "uk": "Обов’язково щодня пити протеїнові коктейлі."}, {"de": "Alle Mahlzeiten durch Riegel ersetzen.", "uk": "Замінювати всю їжу батончиками."}, {"de": "Nur noch tierische Lebensmittel essen.", "uk": "Їсти лише тваринні продукти."}], "explain": {"de": "Für Freizeit- und Fitnesssport sind Spezialprodukte normalerweise nicht nötig.", "uk": "Для оздоровчого спорту й фітнесу спеціальні продукти зазвичай не потрібні."}}]}];

const UI={brand:['Energie entdecken','Відкривай енергію'],eyebrow:['Ernährung · Mission 03','Харчування · Місія 03'],title:['Kohlenhydrate.\nDeine Energie.','Вуглеводи.\nТвоя енергія.'],intro:['Erkunde Lebensmittel und deinen Körper. Löse alle Aufgaben. Besiege dann das Monster und sammle deine acht Merksätze.','Досліджуй продукти й своє тіло. Виконай усі завдання. Потім переможи монстра та отримай вісім висновків.'],stop:['Audio stoppen','Зупинити аудіо'],listen:['Vorlesen','Прослухати'],question:['Deine Aufgabe','Твоє завдання'],correct:['Richtig!','Правильно!'],retry:['Versuche es noch einmal.','Спробуй ще раз.'],solved:['Aufgabe gelöst','Завдання виконано'],next:['Weiter zur nächsten Station','До наступної станції'],progress:['Aufgaben geschafft','завдань виконано'],lockedBoss:['Bosskampf noch gesperrt','Бій із босом ще закритий'],openBoss:['Bosskampf freigeschaltet','Бій із босом відкритий'],boss:['Der Energie-Wächter','Вартовий енергії'],bossIntro:['Acht Angriffe. Acht richtige Antworten in Folge. Ein Fehler: Das Monster frisst dich und der Kampf startet von vorn. Deine Lernaufgaben bleiben gespeichert. Kein Zeitdruck!','Вісім атак. Вісім правильних відповідей поспіль. Помилка: монстр з’їсть тебе, і бій почнеться спочатку. Виконані завдання збережуться. Поспішати не треба!'],bossLock:['Bearbeite zuerst alle acht Wissensfragen und die vier Mitmachaufgaben.','Спочатку виконай усі вісім запитань і чотири інтерактивні завдання.'],start:['Kampf starten','Почати бій'],again:['Noch einmal antreten','Спробувати бій знову'],continue:['Nächster Angriff','Наступна атака'],attack:['Angriff','Атака'],landed:['Treffer!','Влучання!'],defeat:['Oh nein – verschluckt!','О ні — тебе проковтнули!'],defeatText:['Dieser Versuch ist vorbei. Lies die Erklärung. Beim nächsten Versuch brauchst du wieder acht richtige Antworten in Folge.','Ця спроба завершена. Прочитай пояснення. У наступній спробі знову потрібні вісім правильних відповідей поспіль.'],victory:['Geschafft! Du hast den Wächter besiegt.','Готово! Ти переміг вартового.'],victoryText:['Alle acht Angriffe haben getroffen. Deine Merksätze sind jetzt freigeschaltet.','Усі вісім атак влучили. Твої висновки тепер відкриті.'],summary:['Deine acht Merksätze','Твої вісім висновків'],summaryLock:['Besiege den Boss, um deine Merksätze zum Abschreiben freizuschalten.','Переможи боса, щоб відкрити висновки для запису.'],print:['Merksätze drucken','Друкувати висновки'],toSummary:['Zu meinen Merksätzen','До моїх висновків'],reset:['Alles zurücksetzen','Скинути все'],confirm:['Wirklich alle Lernaufgaben und den Sieg auf diesem Gerät löschen?','Справді видалити всі виконані завдання та перемогу на цьому пристрої?'],saveText:['Dein Fortschritt wird nur in diesem Browser gespeichert. Auf einem anderen Gerät beginnst du neu. Ein laufender Bosskampf beginnt nach dem Neuladen wieder bei null.','Твій прогрес зберігається лише в цьому браузері. На іншому пристрої ти почнеш спочатку. Після оновлення сторінки незавершений бій починається з нуля.'],sourceText:['Fachliche Grundlage: DGE und BZfE. Für den Unterricht vereinfacht. Figuren, Energieanzeigen und Kampf sind Lernmodelle, keine Messungen deines Körpers.','Фахова основа: DGE та BZfE. Спрощено для навчання. Персонажі, індикатори енергії та бій — навчальні моделі, а не вимірювання твого тіла.'],sortTitle:['Lebensmittel-Check','Перевірка продуктів'],sortHint:['Entscheide bei jedem Bild: Liefert es viele Kohlenhydrate?','Для кожного малюнка визнач: чи дає продукт багато вуглеводів?'],yes:['Ja, viele Kohlenhydrate','Так, багато вуглеводів'],no:['Nein, keine Kohlenhydrate','Ні, без вуглеводів'],sortGood:['Alle sechs Lebensmittel richtig zugeordnet.','Усі шість продуктів правильно визначено.'],sortWrong:['Schau noch einmal: Brot, Kartoffeln und Nudeln liefern Stärke; normale Cola liefert Zucker. Wasser und Öl enthalten keine Kohlenhydrate.','Подивись ще раз: хліб, картопля й макарони дають крохмаль; звичайна кола — цукор. Вода й олія не містять вуглеводів.'],bodyTitle:['Erkunde beide Bereiche','Досліди обидві ділянки'],brain:['🧠 Gehirn','🧠 Мозок'],muscle:['💪 Muskeln','💪 М’язи'],brainText:['Beim Lesen, Erinnern und Denken arbeitet dein Gehirn. Es braucht dafür ständig Energie.','Під час читання, запам’ятовування й мислення мозок працює. Для цього йому постійно потрібна енергія.'],muscleText:['Beim Gehen, Tanzen und Sport arbeiten deine Muskeln. Kohlenhydrate können dafür Energie liefern.','Під час ходьби, танців і спорту працюють м’язи. Вуглеводи можуть давати для цього енергію.'],bodyHint:['Tippe auf Gehirn und Muskeln.','Натисни на мозок і м’язи.'],chainTitle:['Zerlege die Stärkekette','Розщепи ланцюжок крохмалю'],chainHint:['Drücke viermal auf „Zerlegen“. Beobachte, wie sich die Verbindungen lösen.','Натисни «Розщепити» чотири рази. Спостерігай, як розриваються зв’язки.'],cut:['Zerlegen','Розщепити'],chainDone:['Die Kette ist zerlegt. Glukose-Bausteine können aufgenommen werden und Energie liefern. Das Modell zeigt nur wenige Bausteine; echte Stärkeketten sind viel länger.','Ланцюжок розщеплено. Ланки глюкози можуть засвоюватися й давати енергію. Модель показує лише кілька ланок; справжні ланцюжки набагато довші.'],sugar:['Haushaltszucker: zwei Bausteine','Столовий цукор: дві ланки'],starch:['Stärke: sehr viele Bausteine','Крохмаль: дуже багато ланок'],whole:['Vollkornbrot','Цільнозерновий хліб'],white:['Weißbrot','Білий хліб'],wholeText:['Energie + mehr Ballaststoffe.','Енергія + більше клітковини.'],whiteText:['Auch Energie, aber weniger Ballaststoffe.','Теж енергія, але менше клітковини.'],feedTitle:['Versorge Alex und vergleiche','Забезпеч Алекса й порівняй'],feedHint:['Probiere alle drei Situationen aus. Sie zeigen vereinfacht, was über eine Zeit passieren kann.','Спробуй усі три ситуації. Вони спрощено показують, що може відбуватися з часом.'],meal:['🥪 Passende Mahlzeit','🥪 Відповідна їжа'],cola:['🥤 Nur normale Cola','🥤 Лише звичайна кола'],little:['🍽️ Insgesamt zu wenig','🍽️ Загалом замало їжі'],mealText:['Alex isst zum Beispiel Vollkornbrot mit Belag und Gemüse und trinkt Wasser. Die Mahlzeit liefert Energie und verschiedene Nährstoffe.','Алекс їсть, наприклад, цільнозерновий хліб із начинкою та овочами й п’є воду. Їжа дає енергію та різні поживні речовини.'],colaText:['Der Zucker liefert Alex Energie. Aber Cola liefert keine Ballaststoffe und kaum weitere wichtige Nährstoffe. Nur Cola ersetzt auf Dauer keine Mahlzeiten.','Цукор дає Алексу енергію. Але кола не дає клітковини й майже не дає інших важливих речовин. Постійно замінювати їжу лише колою не можна.'],littleText:['Bekommt Alex insgesamt zu wenig Energie, kann Alex müde werden und sich schlechter konzentrieren. Das bedeutet nicht: Ohne Süßigkeiten fehlt Energie! Auch andere Lebensmittel liefern sie.','Якщо Алекс загалом отримує замало енергії, може виникнути втома й труднощі із зосередженням. Це не означає, що без солодощів бракує енергії! Інші продукти теж її дають.'],energy:['Energieversorgung im Modell','Енергозабезпечення в моделі'],nutrients:['Vielfalt wichtiger Nährstoffe','Різноманітність важливих речовин'],model:['Die Balken sind symbolisch. Keine Mengenmessung, kein Vergleich gleich großer Portionen. Müdigkeit kann auch andere Ursachen haben, zum Beispiel Schlafmangel.','Стовпчики символічні. Це не вимірювання кількості й не порівняння однакових порцій. Втома може мати й інші причини, наприклад брак сну.'],feedDone:['Alle drei Situationen ausprobiert.','Усі три ситуації випробувано.'],storage:['Speichern ist hier nicht möglich. Lass die Seite während der Bearbeitung geöffnet.','Збереження тут недоступне. Залишай сторінку відкритою під час роботи.'],noAudio:['Vorlesen ist in diesem Browser nicht verfügbar.','У цьому браузері озвучення недоступне.'],bossHint:['Du kannst jederzeit oben in den Lernstationen nachlesen.','Ти завжди можеш перечитати навчальні матеріали вище.']};

function stationDone(i){return state.done.includes(i)&&(i!==1||state.sort===6)&&(i!==2||state.body.length===2)&&(i!==4||state.cuts===4)&&(i!==6||state.feed.length===3)}
const attackNames=[["Wortblitz", "Блискавка слів"], ["Quellenwurf", "Кидок джерел"], ["Baustoffstoß", "Удар матеріалів"], ["Bausteinblick", "Погляд на складники"], ["Kombinationskraft", "Сила поєднань"], ["Versorgungswirbel", "Вихор забезпечення"], ["Zellerneuerung", "Оновлення клітин"], ["Werbecheck", "Перевірка реклами"]];
function renderBoss(){let r=ready(),mode=battle.mode;let html=`<div class="eyebrow" style="color:#ffd15a">${r?'⚔':'🔒'} BOSS</div><h2>${t('boss')}</h2><p>${t('bossIntro')}</p>`;if(!r){$('boss').innerHTML=html+`<div class="locked"><img class="monster" src="${MONSTER}" alt="${t('boss')}"><p>${t('bossLock')}</p><strong>${count()} / 12</strong></div>`;return}let hits=mode==='won'?8:battle.step;html+=`<div class="meterlabel"><span>${state.lang==='de'?'Kraft des Monsters':'Сила монстра'}</span><span>${8-hits} / 8</span></div><div class="meter"><span style="width:${(8-hits)/8*100}%;background:#a995ff"></span></div><div class="battlefield ${mode==='hit'?'hit':mode==='lost'?'eaten':mode==='won'?'victory':''}"><span class="hero-player" aria-label="Alex">🧙</span><span class="blast" aria-hidden="true">⚡</span><img class="monster" src="${MONSTER}" alt="${t('boss')}"></div><div class="attacks">${attackNames.map((a,i)=>`<span class="attack ${i<hits?'used':''}">${i<hits?'✓':'◇'} ${a[state.lang==='de'?0:1]}</span>`).join('')}</div>`;
if(mode==='idle')html+=`<button class="primary" data-action="start">${t('start')}</button>`;
if(mode==='asking'){let b=battle.questions[battle.step],q=DATA[b.topic].questions[b.variant];html+=`<div id="bossQuestion"><div class="row"><h3>${t('attack')} ${battle.step+1} / 8 · ${attackNames[b.topic][state.lang==='de'?0:1]}</h3>${readButton('readboss')}</div><p><strong>${tx(q.q)}</strong></p><div class="options boss-options">${b.order.map((n,j)=>`<button data-action="bossanswer" data-n="${n}"><span class="letter">${'ABCD'[j]}</span>${tx(q.options[n])}</button>`).join('')}</div><p class="muted">${t('bossHint')}</p></div>`}
if(mode==='hit')html+=`<div class="feedback good" role="status"><strong>${t('landed')}</strong> ${tx(battle.feedback)}</div><button class="primary" data-action="continue">${t('continue')}</button>`;
if(mode==='lost')html+=`<div class="feedback bad" role="status"><h3 style="color:inherit">${t('defeat')}</h3><p>${t('defeatText')}</p><strong>${tx(battle.feedback)}</strong></div><button class="primary" data-action="start">${t('again')}</button>`;
if(mode==='won'||(mode==='idle'&&state.won))html+=`<div class="feedback good" role="status"><h3 style="color:inherit">${t('victory')}</h3><p>${t('victoryText')}</p><a href="#summary">${t('toSummary')}</a></div>`;
$('boss').innerHTML=html}
function renderSummary(){$('summary').innerHTML=`<h2>${state.won?'🏆':'🔒'} ${t('summary')}</h2>`+(state.won?`<p>${state.lang==='de'?'Übertrage die Sätze auf dein Arbeitsblatt.':'Перепиши речення на свій робочий аркуш.'}</p><div class="row">${readButton('readsummary')}<button class="small" data-action="print">${t('print')}</button></div><div class="memos">${DATA.map((d,i)=>`<article class="memo"><strong>${i+1}. ${tx(d.title)}</strong><p>${tx(d.memo)}</p></article>`).join('')}</div>`:`<p class="locked">${t('summaryLock')}</p>`)}
function startBattle(){if(!ready())return;stop();state.attempts=(Number(state.attempts)||0)+1;battle={mode:'asking',step:0,feedback:'',questions:DATA.map((d,i)=>({topic:i,variant:1+((state.attempts+i)%2),order:shuffle([0,1,2,3])}))};save();renderBoss();focusBoss()}
function answerBoss(n){if(!ready()||battle.mode!=='asking')return;stop();const b=battle.questions[battle.step],q=DATA[b.topic].questions[b.variant];battle.feedback=q.explain;if(n!==0){battle.mode='lost';battle.step=0}else{battle.step++;battle.mode=battle.step===8?'won':'hit';if(battle.mode==='won'){state.won=true;save();renderSummary();}}renderBoss();if(state.won)updateLocks()}
function focusBoss(){const target=$('bossQuestion')||$('boss');target.setAttribute('tabindex','-1');target.focus({preventScroll:true})}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,n=Number(b.dataset.n),i=Number(b.dataset.i);if(a==='quiz'){stop();if(n===0){complete(i);delete quizFeedback[i]}else quizFeedback[i]=true;renderQuiz(i)}else if(a==='sort'){if(state.sort>=6)return;if(Boolean(n)===foods[state.sort][3]){state.sort++;sortError=false}else sortError=true;renderSort();save();updateLocks()}else if(a==='body'){bodyCurrent=n;if(!state.body.includes(n))state.body.push(n);renderBody();save();updateLocks()}else if(a==='cut'){if(n===0){state.cuts=Math.min(4,state.cuts+1);combineError=false}else combineError=true;renderChain();save();updateLocks()}else if(a==='feed'){feedCurrent=n;if(!state.feed.includes(n))state.feed.push(n);renderFeed();save();updateLocks()}else if(a==='start')startBattle();else if(a==='bossanswer')answerBoss(n);else if(a==='continue'&&battle.mode==='hit'){stop();battle.mode='asking';renderBoss();focusBoss()}else if(a==='readfeed'&&feedCurrent!==null)speak(t(['mealText','colaText','littleText'][feedCurrent]));else if(a==='print'&&state.won)window.print();else if(a==='readsummary'&&state.won)speak(DATA.map(d=>d.memo.de).join(' '));else if(a==='readboss'&&battle.mode==='asking'){let bq=battle.questions[battle.step],q=DATA[bq.topic].questions[bq.variant];speak(q.q.de+' '+bq.order.map(n=>q.options[n].de).join(' '))}else if(a.startsWith('readq-')){let j=Number(a.slice(6)),q=DATA[j].questions[0];speak(q.q.de+' '+quizOrders[j].map(n=>q.options[n].de).join(' '))}else if(a.startsWith('read-')){let j=Number(a.slice(5));speak(DATA[j].title.de+'. '+DATA[j].text.de)}});
$('de').onclick=()=>{stop();state.lang='de';render()};$('uk').onclick=()=>{stop();state.lang='uk';render()};$('stop').onclick=stop;$('reset').onclick=()=>{if(confirm(t('confirm'))){stop();state={lang:state.lang,done:[],sort:0,body:[],cuts:0,feed:[],won:false,attempts:0};battle={mode:'idle',step:0,questions:[],feedback:''};quizFeedback={};sortError=false;combineError=false;feedCurrent=bodyCurrent=null;save();render();window.scrollTo(0,0)}};
render();
try{document.modelContext?.registerTool({name:'read_learning_progress',description:'Read completed learning tasks and boss unlock status; does not solve tasks or reveal answers.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:async input=>{if(input&&Object.keys(input).length)throw Error('No parameters expected');return {completed:count(),total:12,bossUnlocked:ready(),bossWon:state.won}}})}catch(e){}
</script></body></html>
